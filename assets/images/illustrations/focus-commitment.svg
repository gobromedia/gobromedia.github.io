<svg viewBox="0 0 200 170" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Our commitment — handshake">
  <style>
    .illo-float{animation:illoFloat 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center;will-change:transform}
    .illo-float.f2{animation-duration:4.4s;animation-delay:-.9s}
    .illo-float.f3{animation-duration:3.1s;animation-delay:-1.7s}
    .illo-spin{animation:illoSpin 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center;will-change:transform}
    @keyframes illoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
    @keyframes illoSpin{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
    @media (prefers-reduced-motion:reduce){.illo-float,.illo-spin{animation:none!important}}
  </style>
  <circle cx="100" cy="85" r="66" fill="#f3e9cf"/>
  <ellipse cx="100" cy="132" rx="42" ry="6.5" fill="#3a3324" opacity="0.06"/>
  <!-- left forearm -->
  <path d="M34 118 l30 -18 18 10 -30 20 z" fill="#c9a84c" stroke="#3a3324" stroke-width="3" stroke-linejoin="round"/>
  <!-- right forearm -->
  <path d="M166 118 l-30 -18 -18 10 30 20 z" fill="#b89630" stroke="#3a3324" stroke-width="3" stroke-linejoin="round"/>
  <!-- clasped hands -->
  <rect x="80" y="86" width="40" height="28" rx="13" fill="#dbb95c" stroke="#3a3324" stroke-width="3" stroke-linejoin="round"/>
  <rect x="92" y="80" width="16" height="15" rx="7" fill="#dbb95c" stroke="#3a3324" stroke-width="2.6"/>
  <path d="M85 100 h30" stroke="#3a3324" stroke-width="2.4" stroke-linecap="round" opacity="0.55"/>
  <!-- trust heart above (floats) -->
  <g class="illo-float">
    <path d="M100 50 c-6 -10 -22 -6 -22 6 c0 10 12 16 22 24 c10 -8 22 -14 22 -24 c0 -12 -16 -16 -22 -6 z" fill="#c9a84c" stroke="#3a3324" stroke-width="2.6" stroke-linejoin="round"/>
  </g>
  <!-- accents -->
  <g class="illo-spin">
    <path d="M150 52 l2.6 6 6 2.6 -6 2.6 -2.6 6 -2.6 -6 -6 -2.6 6 -2.6 z" fill="#dbb95c" stroke="#3a3324" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
  <g class="illo-float f3"><circle cx="46" cy="118" r="5" fill="#b89630" stroke="#3a3324" stroke-width="2"/></g>
</svg>
