<svg viewBox="0 0 200 170" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Our mission — flag on target">
  <style>
    .illo-float{animation:illoFloat 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center;will-change:transform}
    .illo-float.f2{animation-duration:4.4s;animation-delay:-.9s}
    .illo-float.f3{animation-duration:3.1s;animation-delay:-1.7s}
    .illo-spin{animation:illoSpin 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center;will-change:transform}
    @keyframes illoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
    @keyframes illoSpin{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
    @media (prefers-reduced-motion:reduce){.illo-float,.illo-spin{animation:none!important}}
  </style>
  <circle cx="100" cy="85" r="66" fill="#f3e9cf"/>
  <ellipse cx="86" cy="138" rx="38" ry="6" fill="#3a3324" opacity="0.06"/>
  <!-- target (hero object) -->
  <circle cx="86" cy="96" r="36" fill="#f0e2b8" stroke="#3a3324" stroke-width="3.2"/>
  <circle cx="86" cy="96" r="23" fill="#faf3e0" stroke="#3a3324" stroke-width="2.6"/>
  <circle cx="86" cy="96" r="10" fill="#c9a84c" stroke="#3a3324" stroke-width="2.4"/>
  <!-- flag pole -->
  <rect x="112" y="42" width="5" height="72" rx="2.5" fill="#3a3324"/>
  <!-- flag -->
  <path d="M117 45 h34 l-9 12 9 12 h-34 z" fill="#c9a84c" stroke="#3a3324" stroke-width="2.6" stroke-linejoin="round"/>
  <circle cx="114" cy="43" r="4.5" fill="#b89630" stroke="#3a3324" stroke-width="2"/>
  <!-- accents -->
  <g class="illo-spin">
    <path d="M150 60 l2.8 6.5 6.5 2.8 -6.5 2.8 -2.8 6.5 -2.8 -6.5 -6.5 -2.8 6.5 -2.8 z" fill="#dbb95c" stroke="#3a3324" stroke-width="1.6" stroke-linejoin="round"/>
  </g>
  <g class="illo-float f2"><circle cx="46" cy="56" r="5.5" fill="#c9a84c" stroke="#3a3324" stroke-width="2"/></g>
  <g class="illo-float f3"><circle cx="150" cy="118" r="5" fill="#b89630" stroke="#3a3324" stroke-width="2"/></g>
</svg>
