<svg viewBox="0 0 200 170" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Transparent reporting illustration">
  <style>
    .illo-float{animation:illoFloat 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center;will-change:transform}
    .illo-float.f2{animation-duration:4.4s;animation-delay:-.9s}
    .illo-float.f3{animation-duration:3.1s;animation-delay:-1.7s}
    .illo-spin{animation:illoSpin 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center;will-change:transform}
    @keyframes illoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
    @keyframes illoSpin{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
    @media (prefers-reduced-motion:reduce){.illo-float,.illo-spin{animation:none!important}}
  </style>
  <circle cx="100" cy="85" r="66" fill="#f3e9cf"/>
  <ellipse cx="98" cy="136" rx="44" ry="6.5" fill="#3a3324" opacity="0.06"/>
  <!-- report sheet (hero object) -->
  <rect x="54" y="40" width="88" height="88" rx="9" fill="#faf3e0" stroke="#3a3324" stroke-width="3.2"/>
  <rect x="66" y="52" width="44" height="7" rx="3.5" fill="#c9a84c"/>
  <!-- mini bars -->
  <rect x="67" y="98" width="10" height="18" rx="2.5" fill="#dbb95c" stroke="#3a3324" stroke-width="2.2"/>
  <rect x="81" y="88" width="10" height="28" rx="2.5" fill="#e6cf8f" stroke="#3a3324" stroke-width="2.2"/>
  <rect x="95" y="80" width="10" height="36" rx="2.5" fill="#c9a84c" stroke="#3a3324" stroke-width="2.2"/>
  <rect x="109" y="92" width="10" height="24" rx="2.5" fill="#dbb95c" stroke="#3a3324" stroke-width="2.2"/>
  <!-- pie -->
  <circle cx="122" cy="72" r="14" fill="#f0e2b8" stroke="#3a3324" stroke-width="2.6"/>
  <path d="M122 72 L122 58 A14 14 0 0 1 134 79 Z" fill="#c9a84c" stroke="#3a3324" stroke-width="2"/>
  <!-- verified check badge (floats) -->
  <g class="illo-float">
    <circle cx="140" cy="114" r="16" fill="#b89630" stroke="#3a3324" stroke-width="2.8"/>
    <path d="M132 114 l6 7 11 -13" fill="none" stroke="#faf3e0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- accents -->
  <g class="illo-spin">
    <path d="M150 46 l2.6 6 6 2.6 -6 2.6 -2.6 6 -2.6 -6 -6 -2.6 6 -2.6 z" fill="#dbb95c" stroke="#3a3324" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
  <g class="illo-float f3"><circle cx="46" cy="118" r="5" fill="#b89630" stroke="#3a3324" stroke-width="2"/></g>
</svg>
