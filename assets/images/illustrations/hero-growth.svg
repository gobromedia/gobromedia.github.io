<svg viewBox="0 0 460 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Digital growth dashboard illustration">
  <style>
    .illo-float{animation:illoFloat 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center;will-change:transform}
    .illo-float.f2{animation-duration:4.8s;animation-delay:-1.1s}
    .illo-float.f3{animation-duration:3.4s;animation-delay:-2s}
    .illo-float.f4{animation-duration:4.4s;animation-delay:-2.8s}
    .illo-float.f5{animation-duration:3.8s;animation-delay:-.6s}
    .illo-spin{animation:illoSpin 5.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center;will-change:transform}
    @keyframes illoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-11px)}}
    @keyframes illoSpin{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}}
    @media (prefers-reduced-motion:reduce){.illo-float,.illo-spin{animation:none!important}}
  </style>
  <circle cx="230" cy="206" r="188" fill="#f3e9cf" opacity="0.5"/>
  <!-- orbit dots (float) -->
  <g class="illo-float f2"><circle cx="60" cy="90" r="7" fill="#dbb95c" stroke="#3a3324" stroke-width="2.6"/></g>
  <g class="illo-float f3"><circle cx="410" cy="300" r="8" fill="#c9a84c" stroke="#3a3324" stroke-width="2.6"/></g>
  <g class="illo-float f4"><circle cx="392" cy="96" r="6" fill="#b89630" stroke="#3a3324" stroke-width="2.4"/></g>
  <g class="illo-float f5"><circle cx="70" cy="322" r="6" fill="#dbb95c" stroke="#3a3324" stroke-width="2.4"/></g>
  <!-- ground shadow -->
  <ellipse cx="211" cy="308" rx="130" ry="12" fill="#3a3324" opacity="0.06"/>
  <!-- main dashboard card (static hero) -->
  <rect x="96" y="120" width="230" height="176" rx="18" fill="#faf3e0" stroke="#3a3324" stroke-width="4"/>
  <path d="M96 154 v-16 a18 18 0 0 1 18 -18 h194 a18 18 0 0 1 18 18 v16 z" fill="#c9a84c"/>
  <path d="M96 154 h230" stroke="#3a3324" stroke-width="4" stroke-linecap="round"/>
  <circle cx="114" cy="137" r="4.4" fill="#f6eccf"/><circle cx="129" cy="137" r="4.4" fill="#f6eccf"/><circle cx="144" cy="137" r="4.4" fill="#f6eccf"/>
  <!-- bars -->
  <rect x="120" y="238" width="22" height="38" rx="5" fill="#dbb95c" stroke="#3a3324" stroke-width="3"/>
  <rect x="152" y="222" width="22" height="54" rx="5" fill="#e6cf8f" stroke="#3a3324" stroke-width="3"/>
  <rect x="184" y="200" width="22" height="76" rx="5" fill="#c9a84c" stroke="#3a3324" stroke-width="3"/>
  <rect x="216" y="216" width="22" height="60" rx="5" fill="#dbb95c" stroke="#3a3324" stroke-width="3"/>
  <rect x="248" y="188" width="22" height="88" rx="5" fill="#b89630" stroke="#3a3324" stroke-width="3"/>
  <!-- trend line -->
  <path d="M118 214 L160 200 L196 180 L232 190 L284 160" fill="none" stroke="#3a3324" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="118" cy="214" r="5.5" fill="#faf3e0" stroke="#3a3324" stroke-width="3"/>
  <circle cx="284" cy="160" r="5.5" fill="#faf3e0" stroke="#3a3324" stroke-width="3"/>
  <!-- rocket (float) -->
  <g class="illo-float">
    <g transform="rotate(36 360 120)">
      <path d="M360 72 c18 14 26 42 20 70 h-40 c-6 -28 2 -56 20 -70 z" fill="#faf3e0" stroke="#3a3324" stroke-width="3.6" stroke-linejoin="round"/>
      <circle cx="360" cy="120" r="10" fill="#dbb95c" stroke="#3a3324" stroke-width="3"/>
      <path d="M340 142 l-15 9 15 2 z" fill="#c9a84c" stroke="#3a3324" stroke-width="2.6" stroke-linejoin="round"/>
      <path d="M380 142 l15 9 -15 2 z" fill="#c9a84c" stroke="#3a3324" stroke-width="2.6" stroke-linejoin="round"/>
      <path d="M349 148 h22 c-2 18 -9 30 -11 30 s-9 -12 -11 -30 z" fill="#dbb95c" stroke="#3a3324" stroke-width="2.6" stroke-linejoin="round"/>
    </g>
  </g>
  <!-- magnifier (float) -->
  <g class="illo-float f2">
    <g transform="translate(52 290)">
      <rect x="50" y="50" width="36" height="14" rx="7" transform="rotate(45 50 50)" fill="#c9a84c" stroke="#3a3324" stroke-width="3"/>
      <circle cx="34" cy="34" r="30" fill="#f0e2b8" stroke="#3a3324" stroke-width="4"/>
      <path d="M22 40 l8 -8 8 6 12 -16" fill="none" stroke="#b89630" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  <!-- sparkle (spin) -->
  <g class="illo-spin">
    <path d="M356 226 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5 z" fill="#dbb95c" stroke="#3a3324" stroke-width="2.4" stroke-linejoin="round"/>
  </g>
  <!-- rupee coin (float) -->
  <g class="illo-float f3">
    <circle cx="322" cy="306" r="18" fill="#dbb95c" stroke="#3a3324" stroke-width="3.4"/>
    <text x="322" y="313" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#3a3324" text-anchor="middle">&#8377;</text>
  </g>
</svg>
