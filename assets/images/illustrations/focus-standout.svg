<svg viewBox="0 0 200 170" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Why we stand out — award">
  <style>
    .illo-float{animation:illoFloat 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center;will-change:transform}
    .illo-float.f2{animation-duration:4.4s;animation-delay:-.9s}
    .illo-float.f3{animation-duration:3.1s;animation-delay:-1.7s}
    .illo-spin{animation:illoSpin 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center;will-change:transform}
    @keyframes illoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
    @keyframes illoSpin{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
    @media (prefers-reduced-motion:reduce){.illo-float,.illo-spin{animation:none!important}}
  </style>
  <circle cx="100" cy="85" r="66" fill="#f3e9cf"/>
  <ellipse cx="100" cy="134" rx="34" ry="6" fill="#3a3324" opacity="0.06"/>
  <!-- trophy handles -->
  <path d="M66 56 h-14 a11 11 0 0 0 0 28 h6" fill="none" stroke="#3a3324" stroke-width="10" stroke-linecap="round"/>
  <path d="M66 56 h-14 a11 11 0 0 0 0 28 h6" fill="none" stroke="#b89630" stroke-width="6" stroke-linecap="round"/>
  <path d="M134 56 h14 a11 11 0 0 1 0 28 h-6" fill="none" stroke="#3a3324" stroke-width="10" stroke-linecap="round"/>
  <path d="M134 56 h14 a11 11 0 0 1 0 28 h-6" fill="none" stroke="#b89630" stroke-width="6" stroke-linecap="round"/>
  <!-- cup -->
  <path d="M65 46 h70 v18 a35 35 0 0 1 -70 0 z" fill="#c9a84c" stroke="#3a3324" stroke-width="3.2" stroke-linejoin="round"/>
  <!-- stem + base -->
  <rect x="93" y="96" width="14" height="16" fill="#b89630" stroke="#3a3324" stroke-width="2.6"/>
  <rect x="76" y="112" width="48" height="11" rx="4" fill="#b89630" stroke="#3a3324" stroke-width="2.8"/>
  <rect x="84" y="123" width="32" height="8" rx="3" fill="#c9a84c" stroke="#3a3324" stroke-width="2.4"/>
  <!-- star -->
  <path d="M100 56 l4.6 10 11 1 -8.2 7.4 2.6 10.8 -10 -5.6 -10 5.6 2.6 -10.8 -8.2 -7.4 11 -1 z" fill="#f0e2b8" stroke="#3a3324" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- accents -->
  <g class="illo-spin">
    <path d="M150 48 l2.8 6.5 6.5 2.8 -6.5 2.8 -2.8 6.5 -2.8 -6.5 -6.5 -2.8 6.5 -2.8 z" fill="#dbb95c" stroke="#3a3324" stroke-width="1.6" stroke-linejoin="round"/>
  </g>
  <g class="illo-float f2"><circle cx="46" cy="60" r="5.5" fill="#c9a84c" stroke="#3a3324" stroke-width="2"/></g>
  <g class="illo-float f3"><circle cx="152" cy="118" r="5" fill="#b89630" stroke="#3a3324" stroke-width="2"/></g>
</svg>
