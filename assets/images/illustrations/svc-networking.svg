<svg viewBox="0 0 200 170" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Networking solutions illustration">
  <style>
    .illo-float{animation:illoFloat 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center;will-change:transform}
    .illo-float.f2{animation-duration:4.4s;animation-delay:-.9s}
    .illo-float.f3{animation-duration:3.1s;animation-delay:-1.7s}
    .illo-spin{animation:illoSpin 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center;will-change:transform}
    @keyframes illoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
    @keyframes illoSpin{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
    @media (prefers-reduced-motion:reduce){.illo-float,.illo-spin{animation:none!important}}
  </style>
  <circle cx="100" cy="85" r="66" fill="#f3e9cf"/>
  <ellipse cx="100" cy="140" rx="42" ry="6.5" fill="#3a3324" opacity="0.06"/>
  <!-- links -->
  <g stroke="#3a3324" stroke-width="2.6" stroke-linecap="round" opacity="0.7">
    <line x1="66" y1="60" x2="100" y2="88"/>
    <line x1="140" y1="56" x2="100" y2="88"/>
    <line x1="60" y1="114" x2="100" y2="88"/>
    <line x1="146" y1="114" x2="100" y2="88"/>
  </g>
  <!-- outer nodes -->
  <g>
    <circle cx="66" cy="60" r="13" fill="#dbb95c" stroke="#3a3324" stroke-width="2.8"/>
    <circle cx="66" cy="56" r="4" fill="#faf3e0"/><path d="M59 68 a7 7 0 0 1 14 0 z" fill="#faf3e0"/>
  </g>
  <g>
    <circle cx="140" cy="56" r="13" fill="#dbb95c" stroke="#3a3324" stroke-width="2.8"/>
    <circle cx="140" cy="52" r="4" fill="#faf3e0"/><path d="M133 64 a7 7 0 0 1 14 0 z" fill="#faf3e0"/>
  </g>
  <g>
    <circle cx="60" cy="114" r="13" fill="#dbb95c" stroke="#3a3324" stroke-width="2.8"/>
    <circle cx="60" cy="110" r="4" fill="#faf3e0"/><path d="M53 122 a7 7 0 0 1 14 0 z" fill="#faf3e0"/>
  </g>
  <g>
    <circle cx="146" cy="114" r="13" fill="#dbb95c" stroke="#3a3324" stroke-width="2.8"/>
    <circle cx="146" cy="110" r="4" fill="#faf3e0"/><path d="M139 122 a7 7 0 0 1 14 0 z" fill="#faf3e0"/>
  </g>
  <!-- center hub -->
  <circle cx="100" cy="88" r="19" fill="#b89630" stroke="#3a3324" stroke-width="3.2"/>
  <circle cx="100" cy="82" r="6" fill="#faf3e0"/><path d="M89 100 a11 11 0 0 1 22 0 z" fill="#faf3e0"/>
  <!-- sparkle accents -->
  <g class="illo-spin">
    <path d="M100 44 l2.6 6 6 2.6 -6 2.6 -2.6 6 -2.6 -6 -6 -2.6 6 -2.6 z" fill="#dbb95c" stroke="#3a3324" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
  <g class="illo-float f2"><circle cx="164" cy="86" r="4.5" fill="#c9a84c" stroke="#3a3324" stroke-width="1.8"/></g>
  <g class="illo-float f3"><circle cx="36" cy="86" r="4" fill="#b89630" stroke="#3a3324" stroke-width="1.8"/></g>
</svg>
