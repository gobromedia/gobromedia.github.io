<svg viewBox="0 0 200 170" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Digital marketing analytics illustration">
  <style>
    .illo-float{animation:illoFloat 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center;will-change:transform}
    .illo-float.f2{animation-duration:4.4s;animation-delay:-.9s}
    .illo-float.f3{animation-duration:3.1s;animation-delay:-1.7s}
    .illo-spin{animation:illoSpin 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center;will-change:transform}
    @keyframes illoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
    @keyframes illoSpin{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
    @media (prefers-reduced-motion:reduce){.illo-float,.illo-spin{animation:none!important}}
  </style>
  <circle cx="100" cy="85" r="66" fill="#f3e9cf"/>
  <ellipse cx="100" cy="140" rx="46" ry="7" fill="#3a3324" opacity="0.06"/>
  <!-- dashboard card (hero object, static) -->
  <rect x="50" y="52" width="100" height="80" rx="12" fill="#faf3e0" stroke="#3a3324" stroke-width="3.2"/>
  <path d="M50 70 v-6 a12 12 0 0 1 12 -12 h76 a12 12 0 0 1 12 12 v6 z" fill="#c9a84c"/>
  <path d="M50 70 h100" stroke="#3a3324" stroke-width="3.2" stroke-linecap="round"/>
  <circle cx="61" cy="61" r="2.6" fill="#f6eccf"/>
  <circle cx="70" cy="61" r="2.6" fill="#f6eccf"/>
  <!-- bars -->
  <rect x="63" y="104" width="13" height="18" rx="3" fill="#dbb95c" stroke="#3a3324" stroke-width="2.4"/>
  <rect x="82" y="96" width="13" height="26" rx="3" fill="#e6cf8f" stroke="#3a3324" stroke-width="2.4"/>
  <rect x="101" y="88" width="13" height="34" rx="3" fill="#c9a84c" stroke="#3a3324" stroke-width="2.4"/>
  <rect x="120" y="98" width="13" height="24" rx="3" fill="#dbb95c" stroke="#3a3324" stroke-width="2.4"/>
  <!-- trend line + arrow -->
  <path d="M64 98 L86 90 L106 80 L130 68" fill="none" stroke="#3a3324" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M121 66 l11 -2 -3 11 z" fill="#3a3324"/>
  <circle cx="64" cy="98" r="3.4" fill="#faf3e0" stroke="#3a3324" stroke-width="2.4"/>
  <!-- rocket accent -->
  <g class="illo-float">
    <g transform="rotate(34 154 44)">
      <path d="M154 26 c9 6 13 20 10 33 h-20 c-3 -13 1 -27 10 -33 z" fill="#faf3e0" stroke="#3a3324" stroke-width="2.6"/>
      <circle cx="154" cy="44" r="4.4" fill="#dbb95c" stroke="#3a3324" stroke-width="2"/>
      <path d="M144 56 l-7 5 8 1 z" fill="#c9a84c" stroke="#3a3324" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M164 56 l7 5 -8 1 z" fill="#c9a84c" stroke="#3a3324" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M148 60 h12 c-1 8 -5 13 -6 13 s-5 -5 -6 -13 z" fill="#dbb95c"/>
    </g>
  </g>
  <!-- rupee coin accent -->
  <g class="illo-float f2">
    <circle cx="45" cy="120" r="12" fill="#dbb95c" stroke="#3a3324" stroke-width="2.6"/>
    <text x="45" y="125" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#3a3324" text-anchor="middle">&#8377;</text>
  </g>
  <!-- sparkle accent -->
  <g class="illo-spin">
    <path d="M45 46 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3 z" fill="#dbb95c" stroke="#3a3324" stroke-width="1.6" stroke-linejoin="round"/>
  </g>
</svg>
