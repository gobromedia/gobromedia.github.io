<svg viewBox="0 0 200 170" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="48-hour turnaround illustration">
  <style>
    .illo-float{animation:illoFloat 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center;will-change:transform}
    .illo-float.f2{animation-duration:4.4s;animation-delay:-.9s}
    .illo-float.f3{animation-duration:3.1s;animation-delay:-1.7s}
    .illo-spin{animation:illoSpin 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center;will-change:transform}
    @keyframes illoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
    @keyframes illoSpin{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
    @media (prefers-reduced-motion:reduce){.illo-float,.illo-spin{animation:none!important}}
  </style>
  <circle cx="100" cy="85" r="66" fill="#f3e9cf"/>
  <ellipse cx="100" cy="144" rx="42" ry="6.5" fill="#3a3324" opacity="0.06"/>
  <!-- side buttons -->
  <line x1="72" y1="44" x2="63" y2="37" stroke="#3a3324" stroke-width="8" stroke-linecap="round"/>
  <line x1="72" y1="44" x2="63" y2="37" stroke="#b89630" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="128" y1="44" x2="137" y2="37" stroke="#3a3324" stroke-width="8" stroke-linecap="round"/>
  <line x1="128" y1="44" x2="137" y2="37" stroke="#b89630" stroke-width="4.5" stroke-linecap="round"/>
  <!-- crown button -->
  <rect x="94" y="26" width="12" height="9" rx="3" fill="#3a3324"/>
  <rect x="90" y="34" width="20" height="10" rx="3" fill="#b89630" stroke="#3a3324" stroke-width="2.6"/>
  <!-- dial -->
  <circle cx="100" cy="96" r="45" fill="#faf3e0" stroke="#3a3324" stroke-width="3.4"/>
  <circle cx="100" cy="96" r="37" fill="none" stroke="#dbb95c" stroke-width="6" stroke-dasharray="120 300" stroke-linecap="round" transform="rotate(-90 100 96)"/>
  <!-- hands -->
  <line x1="100" y1="96" x2="100" y2="68" stroke="#3a3324" stroke-width="3.6" stroke-linecap="round"/>
  <line x1="100" y1="96" x2="120" y2="104" stroke="#b89630" stroke-width="3.6" stroke-linecap="round"/>
  <circle cx="100" cy="96" r="4.5" fill="#3a3324"/>
  <text x="100" y="128" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#b89630" text-anchor="middle">48h</text>
  <!-- accents -->
  <g class="illo-spin">
    <path d="M154 52 l2.8 6.5 6.5 2.8 -6.5 2.8 -2.8 6.5 -2.8 -6.5 -6.5 -2.8 6.5 -2.8 z" fill="#dbb95c" stroke="#3a3324" stroke-width="1.6" stroke-linejoin="round"/>
  </g>
  <g class="illo-float f2"><circle cx="42" cy="120" r="5.5" fill="#c9a84c" stroke="#3a3324" stroke-width="2"/></g>
</svg>
