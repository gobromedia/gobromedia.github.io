<svg viewBox="0 0 200 170" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Content creator camera illustration">
  <style>
    .illo-float{animation:illoFloat 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center;will-change:transform}
    .illo-float.f2{animation-duration:4.4s;animation-delay:-.9s}
    .illo-float.f3{animation-duration:3.1s;animation-delay:-1.7s}
    .illo-spin{animation:illoSpin 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center;will-change:transform}
    @keyframes illoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
    @keyframes illoSpin{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
    @media (prefers-reduced-motion:reduce){.illo-float,.illo-spin{animation:none!important}}
  </style>
  <circle cx="100" cy="85" r="66" fill="#f3e9cf"/>
  <ellipse cx="100" cy="140" rx="48" ry="7" fill="#3a3324" opacity="0.06"/>
  <!-- viewfinder bump -->
  <path d="M80 66 l6 -13 h20 l6 13 z" fill="#b89630" stroke="#3a3324" stroke-width="3.2" stroke-linejoin="round"/>
  <!-- shutter button -->
  <rect x="120" y="58" width="15" height="10" rx="3" fill="#b89630" stroke="#3a3324" stroke-width="2.6"/>
  <!-- camera body (hero object) -->
  <rect x="48" y="64" width="104" height="66" rx="13" fill="#c9a84c" stroke="#3a3324" stroke-width="3.2"/>
  <path d="M48 82 h104" stroke="#3a3324" stroke-width="2.6" opacity="0.65"/>
  <!-- lens -->
  <circle cx="100" cy="100" r="25" fill="#f0e2b8" stroke="#3a3324" stroke-width="3.2"/>
  <circle cx="100" cy="100" r="15" fill="#dbb95c" stroke="#3a3324" stroke-width="2.4"/>
  <circle cx="94" cy="94" r="4.5" fill="#faf3e0"/>
  <!-- flash light -->
  <circle cx="61" cy="76" r="4.5" fill="#f6eccf" stroke="#3a3324" stroke-width="2"/>
  <!-- sparkle accent -->
  <g class="illo-spin">
    <path d="M56 50 l2.8 6.5 6.5 2.8 -6.5 2.8 -2.8 6.5 -2.8 -6.5 -6.5 -2.8 6.5 -2.8 z" fill="#dbb95c" stroke="#3a3324" stroke-width="1.6" stroke-linejoin="round"/>
  </g>
  <!-- dot accents -->
  <g class="illo-float f2"><circle cx="150" cy="46" r="6" fill="#dbb95c" stroke="#3a3324" stroke-width="2"/></g>
  <g class="illo-float f3"><circle cx="46" cy="120" r="5" fill="#b89630" stroke="#3a3324" stroke-width="2"/></g>
</svg>
