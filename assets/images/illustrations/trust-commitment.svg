<svg viewBox="0 0 200 170" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="First-month commitment guarantee illustration">
  <style>
    .illo-float{animation:illoFloat 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center;will-change:transform}
    .illo-float.f2{animation-duration:4.4s;animation-delay:-.9s}
    .illo-float.f3{animation-duration:3.1s;animation-delay:-1.7s}
    .illo-spin{animation:illoSpin 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center;will-change:transform}
    @keyframes illoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
    @keyframes illoSpin{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
    @media (prefers-reduced-motion:reduce){.illo-float,.illo-spin{animation:none!important}}
  </style>
  <circle cx="100" cy="85" r="66" fill="#f3e9cf"/>
  <ellipse cx="100" cy="146" rx="34" ry="6" fill="#3a3324" opacity="0.06"/>
  <!-- shield (hero object) -->
  <path d="M100 32 l42 16 v34 c0 28 -20 44 -42 54 c-22 -10 -42 -26 -42 -54 V48 z" fill="#c9a84c" stroke="#3a3324" stroke-width="3.4" stroke-linejoin="round"/>
  <path d="M100 44 l30 11 v27 c0 21 -14 33 -30 41 z" fill="#dbb95c"/>
  <!-- check -->
  <path d="M79 87 l14 15 27 -31" fill="none" stroke="#faf3e0" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 30-day mark -->
  <text x="100" y="152" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#b89630" text-anchor="middle">30 days</text>
  <!-- accents -->
  <g class="illo-spin">
    <path d="M150 48 l2.8 6.5 6.5 2.8 -6.5 2.8 -2.8 6.5 -2.8 -6.5 -6.5 -2.8 6.5 -2.8 z" fill="#dbb95c" stroke="#3a3324" stroke-width="1.6" stroke-linejoin="round"/>
  </g>
  <g class="illo-float f2"><circle cx="48" cy="60" r="5.5" fill="#c9a84c" stroke="#3a3324" stroke-width="2"/></g>
  <g class="illo-float f3"><circle cx="46" cy="116" r="5" fill="#b89630" stroke="#3a3324" stroke-width="2"/></g>
</svg>
